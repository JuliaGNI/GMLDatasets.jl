name: CI
on:
  push:
    branches:
      - main
    tags: ["*"]
  pull_request:
concurrency:
  # Skip intermediate builds: always.
  # Cancel intermediate builds: only if it is a pull request build.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }} - ${{ github.event_name }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        # 1.10 is deliberately absent: the `[sources]` block of `Project.toml` is a Julia 1.11
        # feature and Pkg 1.10 cannot resolve this package while `GeometricMachineLearning` 0.5 is
        # unregistered. Put it back together with the compat bound once 0.5 lands.
        version:
          - "1.11"
          - "1.12"
          - "^1.13.0-0"
        os:
          - ubuntu-latest
          - macOS-latest
          - windows-latest
        arch:
          - default
        experimental: [false]
        include:
          - version: "nightly"
            os: ubuntu-latest
            arch: default
            experimental: true
          - version: "nightly"
            os: macOS-latest
            arch: default
            experimental: true
          - version: "nightly"
            os: windows-latest
            arch: default
            experimental: true
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v6
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          files: lcov.info
