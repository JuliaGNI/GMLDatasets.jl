# The environment for both script families.
#
# `Metal` is deliberately absent: it cannot be resolved on Linux and listing it would leave the whole
# environment unprecompilable there. A Mac adds it by hand with
#     julia --project=scripts -e 'using Pkg; Pkg.add("Metal")'
# and keeps that line out of commits. `CUDA` is different — it installs, though non-functional, on
# machines without a device, so the environment resolves everywhere and the CUDA scripts fall back to
# the host.

[deps]
AbstractNeuralNetworks = "60874f82-5ada-4c70-bd1c-fa6be7711c8a"
CUDA = "052768ef-5323-5732-b1bb-66c8b64840ba"
